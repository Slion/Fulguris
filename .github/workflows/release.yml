name: Release

on:
  push:
    branches: [ smooth-toolbar-hide ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish the APK to'
        required: false
        default: 'apk'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Variant built for release. It has no Firebase plugins and release is signed
  # with the debug key (see app/build.gradle), so no secrets are required.
  VARIANT: SlionsFullAgent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository contains developer-machine paths that break CI builds
      - name: Remove local-only settings
        run: |
          rm -f local.properties
          sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties
          sed -i '/^org.gradle.java.installations.paths=/d' gradle.properties
          sed -i '/^org.gradle.java.installations.auto-download=/d' gradle.properties

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assemble${VARIANT}Release -x lint --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_DIR="app/build/outputs/apk/slionsFullAgent/release"
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "APK not found in $APK_DIR" >&2
            exit 1
          fi
          echo "path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "Built: $APK_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulguris-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_FILE: ${{ steps.apk.outputs.path }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE=""
          else
            TAG="${{ github.event.inputs.release_tag || 'apk' }}"
            PRERELEASE="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "Fulguris $TAG" \
              --notes "Automated release build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
              --target "$GITHUB_SHA" \
              $PRERELEASE
          fi
