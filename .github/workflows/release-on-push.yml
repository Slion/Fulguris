name: Release on push

# Builds an APK on every push to a branch that contains this file and
# publishes it right away as a regular (non-draft) GitHub release.
on:
  push:
    branches: [ '**' ]   # branches only: the tag created below must not trigger another run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The repo has local developer paths committed (SDK dir and aapt2 override).
    # They do not exist on the runner, so drop them for CI only.
    - name: Remove local SDK paths
      run: |
        rm -f local.properties
        sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties
        grep -n "aapt2" gradle.properties || echo "aapt2 override removed"

    # Branch names may contain slashes, which are not allowed in file names and are awkward in tags
    - name: Compute names
      id: names
      run: |
        SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')
        echo "branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
        echo "tag=${SAFE_BRANCH}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    # F-Droid flavor does not need Firebase / google-services, release build type
    # is signed with the debug key per app/build.gradle so the APK is installable.
    # Signing: the key lives in repository secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
    # Without them the build is signed with the debug key as before.
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        else
          echo "No keystore secret, using the debug key"
        fi

    - name: Build release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleSlionsFullFdroidRelease --no-daemon

    - name: Collect APK
      run: |
        APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
        echo "Found: $APK"
        mkdir -p dist
        cp "$APK" "dist/Fulguris-${{ steps.names.outputs.tag }}.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: fulguris-release-apk
        path: dist/*.apk

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.names.outputs.tag }}
        name: ${{ steps.names.outputs.branch }} build ${{ github.run_number }}
        body: |
          Automatic build of `${{ github.ref_name }}` at ${{ github.sha }}
        draft: false
        prerelease: false
        target_commitish: ${{ github.sha }}
        files: dist/*.apk
